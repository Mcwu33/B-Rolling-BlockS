<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-Rolling-Block</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #7b5ea7;
            --board-bg: rgba(60, 42, 90, 0.6);
            --cell-bg: #d1bcf9;
            --header-bg: #5d4387;
        }
        body {
            background-color: var(--bg-color);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.5s ease;
        }
        .board-cell {
            background-color: var(--board-bg);
            border-radius: 6px;
            transition: background-color 0.15s ease, transform 0.15s ease;
        }
        .board-cell.highlight {
            background-color: rgba(255, 255, 255, 0.45) !important;
        }
        .board-cell.clearing {
            background-color: #ffffff !important;
            transform: scale(0.85);
        }
        .block-piece-cell {
            background-color: var(--cell-bg);
            border-radius: 4px;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
            transition: background-color 0.5s ease;
        }
        .dock-item.selected {
            transform: scale(1.08);
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -3px); }
            60% { transform: translate(-3px, -2px); }
            80% { transform: translate(3px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .board-shake {
            animation: shake 0.3s ease-in-out;
        }
        .theme-header {
            background-color: var(--header-bg) !important;
            transition: background-color 0.5s ease;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between items-center py-6 px-4 max-w-md mx-auto">

    <!-- Top Header -->
    <div class="w-full flex justify-between items-center px-4">
        <div class="flex items-center space-x-2 theme-header px-4 py-2 rounded-2xl shadow-inner">
            <span class="text-yellow-300 text-lg">🏆</span>
            <div class="flex flex-col">
                <span class="text-[10px] text-purple-200 uppercase tracking-wider font-semibold">High Score</span>
                <span id="highScore" class="text-white font-bold text-sm">0</span>
            </div>
        </div>
        <button onclick="resetGame()" class="theme-header p-3 rounded-2xl shadow-md text-white active:scale-95 transition">
            ⚙️
        </button>
    </div>

    <!-- Current Score & Tip -->
    <div class="text-center my-1">
        <div id="currentScore" class="text-5xl font-black text-white drop-shadow-md tracking-tight">0</div>
        <div id="tipText" class="text-xs text-purple-200 mt-1 h-4 font-medium tracking-wide">💡 点选方块，再点棋盘放置</div>
    </div>

    <!-- 8x8 Game Board -->
    <div id="boardContainer" class="w-full aspect-square max-w-[360px]">
        <div id="board" class="grid grid-cols-8 gap-1.5 theme-header p-3 rounded-2xl shadow-2xl w-full h-full"></div>
    </div>

    <!-- Bottom Piece Dock -->
    <div class="w-full theme-header p-4 rounded-3xl shadow-xl flex justify-around items-center h-32 max-w-[360px]" id="dock"></div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-center items-center z-50">
        <div class="theme-header p-8 rounded-3xl shadow-2xl text-center max-w-xs w-full mx-4 border border-purple-400/30">
            <h2 class="text-2xl font-black text-white mb-2">Game Over</h2>
            <p class="text-purple-200 text-sm mb-6">No more moves available!</p>
            <div class="text-4xl font-black text-yellow-300 mb-6" id="finalScore">0</div>
            <button onclick="resetGame()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-purple-950 font-bold py-3.5 rounded-2xl shadow-lg transition active:scale-95">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let highScore = localStorage.getItem('block_high_score') || 0;
        let currentPieces = [null, null, null];
        let selectedIndex = null;
        
        document.getElementById('highScore').innerText = highScore;

        // 循环主题库
        const THEMES = [
            { bg: '#7b5ea7', board: 'rgba(60, 42, 90, 0.6)', cell: '#d1bcf9', header: '#5d4387' }, // 经典紫
            { bg: '#1a365d', board: 'rgba(20, 40, 70, 0.6)', cell: '#63b3ed', header: '#2a4365' }, // 深海蓝
            { bg: '#22543d', board: 'rgba(20, 50, 35, 0.6)', cell: '#68d391', header: '#276749' }, // 翡翠绿
            { bg: '#742a2a', board: 'rgba(60, 25, 25, 0.6)', cell: '#fc8181', header: '#9b2c2c' }, // 暗夜红
            { bg: '#553c9a', board: 'rgba(45, 30, 80, 0.6)', cell: '#b794f4', header: '#44337a' }  // 赛博紫
        ];
        let currentThemeIndex = 0;

        function applyTheme(index) {
            const t = THEMES[index];
            document.documentElement.style.setProperty('--bg-color', t.bg);
            document.documentElement.style.setProperty('--board-bg', t.board);
            document.documentElement.style.setProperty('--cell-bg', t.cell);
            document.documentElement.style.setProperty('--header-bg', t.header);
        }

        // 完整的方块库（含1粒、2粒、反转L、正T等）
        const SHAPES = [
            [[1]], // 1粒
            [[1, 1]], // 2粒横
            [[1], [1]], // 2粒竖
            [[1, 1], [1, 1]], // 2x2
            [[1, 1, 1], [1, 1, 1], [1, 1, 1]], // 3x3
            [[1, 1, 1]], // 3x1
            [[1], [1], [1]], // 1x3
            [[1, 1, 1, 1]], // 4x1
            [[1], [1], [1], [1]], // 1x4
            [[1, 1], [1, 0]], // 小L
            [[1, 0], [1, 1]], // 反转L
            [[1, 1, 1], [1, 0, 0]], // 标准L
            [[1, 1, 1], [0, 0, 1]], // 反L
            [[0, 1, 0], [1, 1, 1]], // 正T型
            [[1, 1, 0], [0, 1, 1]], // Z型
            [[0, 1, 1], [1, 1, 0]], // 倒Z型
            [[1, 1], [1, 1], [1, 1]], // 2x3
            [[1, 1, 1], [1, 1, 1]]  // 3x2
        ];

        const boardEl = document.getElementById('board');
        const dockEl = document.getElementById('dock');
        const tipTextEl = document.getElementById('tipText');
        const boardContainerEl = document.getElementById('boardContainer');

        function initBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'board-cell w-full h-full cursor-pointer';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function spawnPieces() {
            currentPieces = [];
            selectedIndex = null;
            tipTextEl.innerText = "💡 请点选下方方块，再点棋盘放置";
            for (let i = 0; i < 3; i++) {
                const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                // 标记是否为 T 型
                const isT = (shape.length === 2 && shape[0].length === 3 && shape[0][1] === 1);
                currentPieces.push({ matrix: shape, type: isT ? 't_shape' : 'normal' });
            }
            renderDock();
            checkGameOver();
        }

        function renderDock() {
            dockEl.innerHTML = '';
            currentPieces.forEach((piece, index) => {
                const container = document.createElement('div');
                container.className = `w-1/3 h-full flex justify-center items-center cursor-pointer p-1 transition-all dock-item ${selectedIndex === index ? 'selected' : ''}`;
                
                if (piece) {
                    const shape = piece.matrix;
                    const preview = document.createElement('div');
                    preview.className = 'grid gap-0.5 pointer-events-none';
                    const rows = shape.length;
                    const cols = shape[0].length;
                    preview.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
                    
                    shape.forEach(row => {
                        row.forEach(val => {
                            const block = document.createElement('div');
                            const size = Math.max(rows, cols) > 2 ? '12px' : '16px';
                            block.style.width = size;
                            block.style.height = size;
                            block.className = val ? 'block-piece-cell' : 'opacity-0';
                            preview.appendChild(block);
                        });
                    });

                    container.appendChild(preview);
                    container.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectPiece(index);
                    });
                }
                dockEl.appendChild(container);
            });
        }

        function selectPiece(index) {
            if (!currentPieces[index]) return;
            selectedIndex = index;
            tipTextEl.innerText = "👉 已选中，请点击棋盘目标位置放置！";
            renderDock();
        }

        function handleCellClick(r, c) {
            if (selectedIndex === null || !currentPieces[selectedIndex]) {
                tipTextEl.innerText = "⚠️ 请先点选下方的一个方块！";
                return;
            }

            const piece = currentPieces[selectedIndex];
            const shape = piece.matrix;
            
            let startR = r;
            let startC = c;
            if (piece.type === 't_shape') {
                startR = r - 1; 
                startC = c - 1;
            }

            if (canPlace(shape, startR, startC)) {
                shape.forEach((row, rIdx) => {
                    row.forEach((val, cIdx) => {
                        if (val) {
                            board[startR + rIdx][startC + cIdx] = 1;
                        }
                    });
                });

                score += shape.flat().reduce((a, b) => a + b, 0) * 10;
                currentPieces[selectedIndex] = null;
                selectedIndex = null;
                
                updateBoardUI();
                renderDock();
                checkClearsAndBoardEmpty();

                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    checkGameOver();
                }
            } else {
                tipTextEl.innerText = "❌ 此处放不下该形状，换个位置试试！";
            }
        }

        function canPlace(shape, startR, startC) {
            const rows = shape.length;
            const cols = shape[0].length;
            
            if (startR < 0 || startC < 0 || startR + rows > BOARD_SIZE || startC + cols > BOARD_SIZE) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] === 1 && board[startR + r][startC + c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function updateBoardUI() {
            const cells = document.querySelectorAll('.board-cell');
            cells.forEach(cell => {
                const r = cell.dataset.row;
                const c = cell.dataset.col;
                if (board[r][c] === 1) {
                    cell.style.backgroundColor = varColor();
                    cell.style.boxShadow = 'inset 0 -2px 0 rgba(0,0,0,0.15)';
                } else {
                    cell.style.backgroundColor = '';
                    cell.style.boxShadow = '';
                }
            });
            document.getElementById('currentScore').innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('block_high_score', highScore);
                document.getElementById('highScore').innerText = highScore;
            }
        }

        function varColor() {
            return getComputedStyle(document.documentElement).getPropertyValue('--cell-bg').trim();
        }

        // 核心检查：消除行/列，并且检测全盘是否清空！
        function checkClearsAndBoardEmpty() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (board[r].every(val => val === 1)) rowsToClear.push(r);
            }
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board.every(row => row[c] === 1)) colsToClear.push(c);
            }

            if (rowsToClear.length > 0 || colsToClear.length > 0) {
                if (navigator.vibrate) navigator.vibrate(60);
                boardContainerEl.classList.add('board-shake');
                setTimeout(() => boardContainerEl.classList.remove('board-shake'), 300);

                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                        if (cell) cell.classList.add('clearing');
                    }
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) {
                        const cell = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                        if (cell) cell.classList.add('clearing');
                    }
                });

                setTimeout(() => {
                    rowsToClear.forEach(r => {
                        for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = 0;
                    });
                    colsToClear.forEach(c => {
                        for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = 0;
                    });
                    document.querySelectorAll('.board-cell').forEach(c => c.classList.remove('clearing'));

                    const clearedCount = rowsToClear.length + colsToClear.length;
                    score += clearedCount * 150;
                    tipTextEl.innerText = `💥 消除奖励 +${clearedCount * 150}`;
                    updateBoardUI();

                    // 检查常规消除后，盘面是不是彻底空了！
                    checkBoardCompleteEmpty();
                }, 200);
            } else {
                // 即使没有触发整行整列消除，也要检查单次放置后盘面是不是刚好空了
                checkBoardCompleteEmpty();
            }
        }

        // 检查棋盘是否完全一干二净（没有任何方块残留）
        function checkBoardCompleteEmpty() {
            const isBoardEmpty = board.every(row => row.every(val => val === 0));
            if (isBoardEmpty) {
                // 轰！全清奖励爆发！
                if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
                boardContainerEl.classList.add('board-shake');
                setTimeout(() => boardContainerEl.classList.remove('board-shake'), 400);

                // 全盘闪烁特效
                document.querySelectorAll('.board-cell').forEach(cell => cell.classList.add('clearing'));

                setTimeout(() => {
                    document.querySelectorAll('.board-cell').forEach(c => c.classList.remove('clearing'));
                    
                    // 自动切换不同主题色
                    currentThemeIndex = (currentThemeIndex + 1) % THEMES.length;
                    applyTheme(currentThemeIndex);

                    score += 1000; // 全清超级大奖励分
                    tipTextEl.innerText = "🌟 完美全清（PERFECT）！主题皮肤已自动切换，积分 +1000！";
                    updateBoardUI();
                }, 300);
            }
        }

        function checkGameOver() {
            const remainingPieces = currentPieces.filter(p => p !== null);
            if (remainingPieces.length === 0) return;

            let canMove = false;
            for (let item of remainingPieces) {
                const piece = item.matrix;
                const isT = item.type === 't_shape';
                const pRows = piece.length;
                const pCols = piece[0].length;
                
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        const testR = isT ? r - 1 : r;
                        const testC = isT ? c - 1 : c;
                        if (canPlace(piece, testR, testC)) {
                            canMove = true;
                            break;
                        }
                    }
                    if (canMove) break;
                }
                if (canMove) break;
            }

            if (!canMove) {
                document.getElementById('finalScore').innerText = score;
                document.getElementById('gameOverModal').classList.remove('hidden');
            }
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
            score = 0;
            currentThemeIndex = 0;
            applyTheme(currentThemeIndex);
            document.getElementById('gameOverModal').classList.add('hidden');
            updateBoardUI();
            spawnPieces();
        }

        initBoard();
        spawnPieces();
    </script>
</body>
</html>
