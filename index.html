<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-Rolling-Block</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #7b5ea7;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .board-cell {
            background-color: rgba(60, 42, 90, 0.6);
            border-radius: 6px;
            transition: background-color 0.15s ease;
        }
        .board-cell.highlight {
            background-color: rgba(255, 255, 255, 0.4) !important;
        }
        .block-piece-cell {
            background-color: #d1bcf9;
            border-radius: 4px;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
        }
        .dragging-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.85;
            transform: scale(1.1);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body class="flex flex-col h-screen justify-between items-center py-6 px-4 max-w-md mx-auto">

    <!-- Top Header: High Score & Score -->
    <div class="w-full flex justify-between items-center px-4">
        <div class="flex items-center space-x-2 bg-[#5d4387] px-4 py-2 rounded-2xl shadow-inner">
            <span class="text-yellow-300 text-lg">🏆</span>
            <div class="flex flex-col">
                <span class="text-[10px] text-purple-200 uppercase tracking-wider font-semibold">High Score</span>
                <span id="highScore" class="text-white font-bold text-sm">0</span>
            </div>
        </div>
        <button onclick="resetGame()" class="bg-[#5d4387] hover:bg-[#6e519e] p-3 rounded-2xl shadow-md text-white active:scale-95 transition">
            ⚙️
        </button>
    </div>

    <!-- Current Score (No Heart) -->
    <div class="text-center my-2">
        <div id="currentScore" class="text-5xl font-black text-white drop-shadow-md tracking-tight">0</div>
    </div>

    <!-- 8x8 Game Board -->
    <div id="board" class="grid grid-cols-8 gap-1.5 bg-[#4c3473] p-3 rounded-2xl shadow-2xl w-full aspect-square max-w-[360px]">
        <!-- Dynamic Cells Generated via JS -->
    </div>

    <!-- Bottom Piece Dock -->
    <div class="w-full bg-[#5d4387] p-4 rounded-3xl shadow-xl flex justify-around items-center h-32 max-w-[360px]" id="dock">
        <!-- 3 Random Spawned Pieces -->
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-center items-center z-50">
        <div class="bg-[#684c96] p-8 rounded-3xl shadow-2xl text-center max-w-xs w-full mx-4 border border-purple-400/30">
            <h2 class="text-2xl font-black text-white mb-2">Game Over</h2>
            <p class="text-purple-200 text-sm mb-6">No more moves available!</p>
            <div class="text-4xl font-black text-yellow-300 mb-6" id="finalScore">0</div>
            <button onclick="resetGame()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-purple-950 font-bold py-3.5 rounded-2xl shadow-lg transition active:scale-95">
                Play Again
            </button>
        </div>
    </div>

    <script>
        const BOARD_SIZE = 8;
        let board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let highScore = localStorage.getItem('block_high_score') || 0;
        let currentPieces = [null, null, null];
        
        document.getElementById('highScore').innerText = highScore;

        // Piece templates
        const SHAPES = [
            [[1]], // 1x1
            [[1, 1]], // 2x1
            [[1], [1]], // 1x2
            [[1, 1], [1, 1]], // 2x2 square
            [[1, 1, 1]], // 3x1
            [[1], [1], [1]], // 1x3
            [[1, 1], [1, 0]], // L-shape small
            [[1, 1, 1], [1, 0, 0]], // L-shape
        ];

        const boardEl = document.getElementById('board');
        const dockEl = document.getElementById('dock');

        function initBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'board-cell w-full h-full';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardEl.appendChild(cell);
                }
            }
        }

        function spawnPieces() {
            currentPieces = [];
            for (let i = 0; i < 3; i++) {
                const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                currentPieces.push(randomShape);
            }
            renderDock();
            checkGameOver();
        }

        function renderDock() {
            dockEl.innerHTML = '';
            currentPieces.forEach((shape, index) => {
                const container = document.createElement('div');
                container.className = 'w-1/3 h-full flex justify-center items-center cursor-grab active:cursor-grabbing p-1';
                
                if (shape) {
                    const preview = document.createElement('div');
                    preview.className = 'grid gap-1';
                    const rows = shape.length;
                    const cols = shape[0].length;
                    preview.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
                    
                    shape.forEach(row => {
                        row.forEach(val => {
                            const block = document.createElement('div');
                            block.style.width = '18px';
                            block.style.height = '18px';
                            block.className = val ? 'block-piece-cell' : 'opacity-0';
                            preview.appendChild(block);
                        });
                    });

                    container.appendChild(preview);
                    initDragAndDrop(container, index);
                }
                dockEl.appendChild(container);
            });
        }

        let draggedPieceIndex = null;
        let ghostEl = null;

        function initDragAndDrop(container, index) {
            const handleStart = (e) => {
                if (!currentPieces[index]) return;
                draggedPieceIndex = index;
                
                const touch = e.touches ? e.touches[0] : e;
                ghostEl = container.cloneNode(true);
                ghostEl.className = 'dragging-ghost';
                ghostEl.style.left = `${touch.clientX - 40}px`;
                ghostEl.style.top = `${touch.clientY - 60}px`;
                document.body.appendChild(ghostEl);
                
                container.style.opacity = '0.3';
                e.preventDefault();
            };

            const handleMove = (e) => {
                if (draggedPieceIndex === null || !ghostEl) return;
                const touch = e.touches ? e.touches[0] : e;
                ghostEl.style.left = `${touch.clientX - 40}px`;
                ghostEl.style.top = `${touch.clientY - 60}px`;

                highlightTargetCell(touch.clientX, touch.clientY);
                e.preventDefault();
            };

            const handleEnd = (e) => {
                if (draggedPieceIndex === null) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                
                if (ghostEl) {
                    ghostEl.remove();
                    ghostEl = null;
                }
                container.style.opacity = '1';

                tryDrop(touch.clientX, touch.clientY, draggedPieceIndex);
                clearHighlights();
                draggedPieceIndex = null;
                e.preventDefault();
            };

            container.addEventListener('touchstart', handleStart, {passive: false});
            window.addEventListener('touchmove', handleMove, {passive: false});
            window.addEventListener('touchend', handleEnd, {passive: false});

            container.addEventListener('mousedown', handleStart);
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);
        }

        function getTargetBoardCell(x, y) {
            const cells = document.querySelectorAll('.board-cell');
            for (let cell of cells) {
                const rect = cell.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return { r: parseInt(cell.dataset.row), c: parseInt(cell.dataset.col) };
                }
            }
            return null;
        }

        function highlightTargetCell(x, y) {
            clearHighlights();
            const target = getTargetBoardCell(x, y);
            if (!target || draggedPieceIndex === null) return;

            const shape = currentPieces[draggedPieceIndex];
            if (!canPlace(shape, target.r, target.c)) return;

            shape.forEach((row, rIdx) => {
                row.forEach((val, cIdx) => {
                    if (val) {
                        const cell = document.querySelector(`[data-row="${target.r + rIdx}"][data-col="${target.c + cIdx}"]`);
                        if (cell) cell.classList.add('highlight');
                    }
                });
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.board-cell').forEach(c => c.classList.remove('highlight'));
        }

        function canPlace(shape, startR, startC) {
            const rows = shape.length;
            const cols = shape[0].length;
            if (startR + rows > BOARD_SIZE || startC + cols > BOARD_SIZE) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] && board[startR + r][startC + c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function tryDrop(x, y, index) {
            const target = getTargetBoardCell(x, y);
            if (!target) return;

            const shape = currentPieces[index];
            if (canPlace(shape, target.r, target.c)) {
                // Place piece
                shape.forEach((row, rIdx) => {
                    row.forEach((val, cIdx) => {
                        if (val) {
                            board[target.r + rIdx][target.c + cIdx] = 1;
                        }
                    });
                });

                score += shape.flat().reduce((a, b) => a + b, 0) * 10;
                currentPieces[index] = null;
                
                updateBoardUI();
                renderDock();
                checkClears();

                if (currentPieces.every(p => p === null)) {
                    spawnPieces();
                } else {
                    checkGameOver();
                }
            }
        }

        function updateBoardUI() {
            const cells = document.querySelectorAll('.board-cell');
            cells.forEach(cell => {
                const r = cell.dataset.row;
                const c = cell.dataset.col;
                if (board[r][c] === 1) {
                    cell.style.backgroundColor = '#d1bcf9';
                    cell.style.boxShadow = 'inset 0 -2px 0 rgba(0,0,0,0.15)';
                } else {
                    cell.style.backgroundColor = 'rgba(60, 42, 90, 0.6)';
                    cell.style.boxShadow = 'none';
                }
            });
            document.getElementById('currentScore').innerText = score;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('block_high_score', highScore);
                document.getElementById('highScore').innerText = highScore;
            }
        }

        function checkClears() {
            let rowsToClear = [];
            let colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (board[r].every(val => val === 1)) rowsToClear.push(r);
            }
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (board.every(row => row[c] === 1)) colsToClear.push(c);
            }

            if (rowsToClear.length > 0 || colsToClear.length > 0) {
                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = 0;
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = 0;
                });

                const clearedCount = rowsToClear.length + colsToClear.length;
                score += clearedCount * 100;
                updateBoardUI();
            }
        }

        function checkGameOver() {
            const remainingPieces = currentPieces.filter(p => p !== null);
            if (remainingPieces.length === 0) return;

            let canMove = false;
            for (let piece of remainingPieces) {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlace(piece, r, c)) {
                            canMove = true;
                            break;
                        }
                    }
                    if (canMove) break;
                }
                if (canMove) break;
            }

            if (!canMove) {
                document.getElementById('finalScore').innerText = score;
                document.getElementById('gameOverModal').classList.remove('hidden');
            }
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
            score = 0;
            document.getElementById('gameOverModal').classList.add('hidden');
            updateBoardUI();
            spawnPieces();
        }

        // Initialize game on load
        initBoard();
        spawnPieces();
    </script>
</body>
</html>
