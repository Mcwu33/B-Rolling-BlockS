<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-Rolling-Block</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gameBg: '#8A70D6',
                        boardBg: '#4A3B7E',
                        cellBg: '#5D4C93',
                        cellFilled: '#B892FF',
                        accentPink: '#FF84B7',
                        gold: '#FFD700'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            overscroll-behavior: none;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #7B5EC7;
        }
        .block-cell {
            transition: background-color 0.15s ease, transform 0.15s ease;
        }
        @keyframes pop {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pop-anim {
            animation: pop 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gameBg text-white h-screen w-screen flex flex-col justify-between items-center select-none overflow-hidden p-4">

    <!-- Top Header: Best Score & Current Score -->
    <div class="w-full max-w-md flex justify-between items-center px-2 pt-2">
        <div class="flex items-center space-x-1.5 bg-black/20 px-3 py-1.5 rounded-full backdrop-blur-sm">
            <span class="text-gold text-lg">🏆</span>
            <span id="best-score" class="font-bold text-sm tracking-wide">0</span>
        </div>
        <div class="flex items-center space-x-1 bg-black/10 px-3 py-1.5 rounded-full">
            <span class="text-xs uppercase tracking-wider opacity-75">B-Rolling</span>
        </div>
        <button onclick="resetGame()" class="bg-black/20 hover:bg-black/30 p-2 rounded-full transition active:scale-95" title="Restart">
            ⚙️
        </button>
    </div>

    <!-- Score Card -->
    <div class="relative flex flex-col items-center my-2">
        <div class="absolute -top-3 text-pink-300 text-xl animate-pulse">💖</div>
        <div id="current-score" class="text-4xl font-extrabold tracking-wider drop-shadow-md">0</div>
    </div>

    <!-- 8x8 Board Container -->
    <div class="w-full max-w-[360px] aspect-square bg-boardBg p-3 rounded-3xl shadow-2xl flex items-center justify-center border-4 border-white/10 relative">
        <div id="board" class="grid grid-cols-8 grid-rows-8 gap-1.5 w-full h-full">
            <!-- Generated via JS -->
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-modal" class="absolute inset-0 bg-black/70 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center space-y-4 hidden z-50">
            <h2 class="text-3xl font-bold tracking-wide text-accentPink">Game Over</h2>
            <p class="text-sm opacity-80">No more moves available!</p>
            <div class="text-xl font-semibold bg-white/10 px-4 py-2 rounded-xl">Score: <span id="final-score">0</span></div>
            <button onclick="resetGame()" class="mt-2 px-6 py-3 bg-gradient-to-r from-pink-500 to-purple-500 rounded-2xl font-bold text-base shadow-lg active:scale-95 transition">
                Play Again
            </button>
        </div>
    </div>

    <!-- Bottom Dock: 3 Pieces -->
    <div class="w-full max-w-md bg-boardBg/60 backdrop-blur-md p-4 rounded-3xl shadow-lg flex justify-around items-center h-32 mb-2 border border-white/10">
        <div id="dock-0" class="flex-1 flex items-center justify-center h-full cursor-pointer relative"></div>
        <div id="dock-1" class="flex-1 flex items-center justify-center h-full cursor-pointer relative"></div>
        <div id="dock-2" class="flex-1 flex items-center justify-center h-full cursor-pointer relative"></div>
    </div>

    <!-- Game Logic & Interaction Script -->
    <script>
        const BOARD_SIZE = 8;
        let board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let bestScore = localStorage.getItem('brb_best') || 0;
        let dockPieces = [null, null, null];
        let selectedDockIndex = null;

        // Shape templates
        const SHAPES = [
            [[1]], // 1x1
            [[1, 1]], // 1x2 horizontal
            [[1], [1]], // 2x1 vertical
            [[1, 1], [1, 1]], // 2x2 square
            [[1, 1, 1]], // 1x3
            [[1], [1], [1]], // 3x1
            [[1, 1], [1, 0]], // L-shape small
            [[1, 1, 1], [1, 1, 1], [1, 1, 1]], // 3x3 square
            [[1, 1, 1], [0, 1, 0]] // T-shape
        ];

        const COLORS = ['#D1B3FF', '#B892FF', '#9E72FF', '#E4C1F9', '#F72585', '#4CC9F0'];

        document.getElementById('best-score').textContent = bestScore;

        function initGame() {
            board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
            score = 0;
            updateScore(0);
            document.getElementById('game-over-modal').classList.add('hidden');
            generateNewPieces();
            renderBoard();
        }

        function resetGame() {
            initGame();
        }

        function updateScore(points) {
            score += points;
            document.getElementById('current-score').textContent = score;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('brb_best', bestScore);
                document.getElementById('best-score').textContent = bestScore;
            }
        }

        function getRandomShape() {
            const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            return { shape, color };
        }

        function generateNewPieces() {
            for (let i = 0; i < 3; i++) {
                dockPieces[i] = getRandomShape();
            }
            renderDock();
            checkGameOver();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = `w-full h-full rounded-md block-cell ${board[r][c] ? 'shadow-inner' : 'bg-cellBg/40'}`;
                    if (board[r][c]) {
                        cell.style.backgroundColor = board[r][c];
                    }
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    // Tap to place support
                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function renderDock() {
            for (let i = 0; i < 3; i++) {
                const dockEl = document.getElementById(`dock-${i}`);
                dockEl.innerHTML = '';
                const piece = dockPieces[i];
                if (!piece) continue;

                const wrapper = document.createElement('div');
                wrapper.className = `grid gap-1 p-1 rounded-xl transition-transform ${selectedDockIndex === i ? 'scale-110 ring-2 ring-white' : 'opacity-90'}`;
                const rows = piece.shape.length;
                const cols = piece.shape[0].length;
                wrapper.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const block = document.createElement('div');
                        block.className = 'w-5 h-5 rounded-sm';
                        if (piece.shape[r][c]) {
                            block.style.backgroundColor = piece.color;
                            block.className += ' shadow-md';
                        } else {
                            block.style.backgroundColor = 'transparent';
                        }
                        wrapper.appendChild(block);
                    }
                }

                wrapper.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedDockIndex = (selectedDockIndex === i) ? null : i;
                    renderDock();
                });

                dockEl.appendChild(wrapper);
            }
        }

        function handleCellClick(targetR, targetC) {
            if (selectedDockIndex === null) return;
            const piece = dockPieces[selectedDockIndex];
            if (!piece) return;

            if (canPlacePiece(piece.shape, targetR, targetC)) {
                placePiece(piece.shape, piece.color, targetR, targetC);
                dockPieces[selectedDockIndex] = null;
                selectedDockIndex = null;

                // Check if all dock pieces are used, generate new 3
                if (dockPieces.every(p => p === null)) {
                    generateNewPieces();
                } else {
                    renderDock();
                    checkGameOver();
                }
            }
        }

        function canPlacePiece(shape, startR, startC) {
            const rows = shape.length;
            const cols = shape[0].length;
            if (startR + rows > BOARD_SIZE || startC + cols > BOARD_SIZE) return false;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c] && board[startR + r][startC + c] !== 0) {
                        return false;
                    }
                }
            }
            return true;
        }

        function placePiece(shape, color, startR, startC) {
            const rows = shape.length;
            const cols = shape[0].length;
            let blocksPlaced = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (shape[r][c]) {
                        board[startR + r][startC + c] = color;
                        blocksPlaced++;
                    }
                }
            }

            updateScore(blocksPlaced * 10);
            renderBoard();
            checkLinesAndClear();
        }

        function checkLinesAndClear() {
            let fullRows = [];
            let fullCols = [];

            // Check rows
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (board[r].every(cell => cell !== 0)) {
                    fullRows.push(r);
                }
            }

            // Check cols
            for (let c = 0; c < BOARD_SIZE; c++) {
                let isColFull = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][c] === 0) {
                        isColFull = false;
                        break;
                    }
                }
                if (isColFull) fullCols.push(c);
            }

            let clearedCount = fullRows.length + fullCols.length;
            if (clearedCount > 0) {
                // Clear rows
                fullRows.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = 0;
                });
                // Clear cols
                fullCols.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = 0;
                });

                updateScore(clearedCount * 100 * clearedCount); // Bonus multiplier for multiple lines
                renderBoard();
            }
        }

        function checkGameOver() {
            // Check if any remaining piece in dock can fit anywhere on the board
            let possibleMoves = false;
            for (let i = 0; i < 3; i++) {
                const piece = dockPieces[i];
                if (!piece) continue;

                for (let r = 0; r < BOARD_SIZE; r++) {
                    for (let c = 0; c < BOARD_SIZE; c++) {
                        if (canPlacePiece(piece.shape, r, c)) {
                            possibleMoves = true;
                            break;
                        }
                    }
                    if (possibleMoves) break;
                }
                if (possibleMoves) break;
            }

            if (!possibleMoves && dockPieces.some(p => p !== null)) {
                document.getElementById('final-score').textContent = score;
                document.getElementById('game-over-modal').classList.remove('hidden');
            }
        }

        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
